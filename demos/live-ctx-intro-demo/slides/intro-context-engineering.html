.session-label[LIVE INTRO · 10 SLIDES]

# Context Engineering: The Basics

## Everything the model sees is a design decision.

.footer[Hands-On Context Engineering<span>O'Reilly Live Training · Lucas Soares</span>]

???
10 slides, ~15 minutes. One mental model (context = RAM), one anatomy (what's actually in the messages array), one toolkit (Write / Select / Compress / Isolate). Each slide with a `demo:` note maps to a script in `../code/`.

---

# How do you get good outputs from LLMs?

**`f(a, b, c, …) = good output`**

*What are the variables?*

--

- The model
- The instructions
- The data you put in front of it
- The tools it can call
- Everything said so far

**All of that, except the model, is *context*.**

???
Hook. Let the audience name variables for 30 seconds. Then reveal: it's all context. demo: `01_what_the_model_sees.py`

---

.eyebrow-label[DEFINITION]

# Prompt engineering vs. context engineering

.two-col[
<div>
<div class="col-head">PROMPT ENGINEERING</div>
Writing and organizing <strong>instructions</strong>. A discrete task: you write it once.
<span class="example"><em>"Find the right words for the system prompt."</em></span>
</div>
<div>
<div class="col-head blue">CONTEXT ENGINEERING</div>
Curating the <strong>optimal set of tokens</strong> at inference: instructions, tools, history, retrieved data, memory. Iterative: curation happens on every call.
<span class="example"><em>"What configuration of context is most likely to produce the behavior we want?"</em></span>
</div>
]

???
Anthropic's framing: context engineering is "the natural progression of prompt engineering." Prompting was the whole job when most tasks were one-shot. Agents run in a loop and generate data every turn, so the curation phase repeats each time you decide what to pass to the model. Source: assets/anthropic-effective-context-engineering.md

---

.eyebrow-label[ANATOMY]

# What the model actually sees

| Slot | Example | Who controls it |
|---|---|---|
| System prompt | role, rules, format | you, static |
| Tool definitions | `search_docs(query)` | you, static |
| Conversation history | prior turns | grows per turn |
| Retrieved / injected data | file contents, DB rows | your retrieval code |
| Tool results | JSON blobs, logs | the tools |
| User message | the question | the user |

**One flat list of tokens. Goal: the smallest set of high-signal tokens that gets the outcome you want.**

???
Print the real `messages` array in the demo. Students are usually surprised how much of it is not the "prompt". Anthropic's per-slot guidance: system prompt at the "right altitude" (not brittle if-else logic, not vague hand-waving), sectioned with headers or XML tags; a minimal tool set with no overlap (if an engineer can't say which tool applies, the model can't either); a few diverse canonical examples instead of a laundry list of edge cases. demo: `01_what_the_model_sees.py`

---

class: center, middle

.eyebrow-label[MENTAL MODEL]

# Context is an attention budget

**Every token attends to every other token: n² relationships. Every token you add spends some of the budget.**

*A finite resource with diminishing marginal returns. 200k is a budget, not "unlimited".*

???
Anthropic's term: "attention budget." Transformers create n² pairwise relationships; as n grows, that attention gets stretched thin. Models also trained mostly on shorter sequences, so they have less practice with context-wide dependencies. RAM analogy still works: model = CPU, window = RAM, files/DB = disk. demo: `02_context_budget.py`

---

class: stat

.eyebrow-label[CONTEXT ROT]

.hero[more ≠ better]

.caption[As tokens in the window increase, recall of what's in it decreases.<br>A **performance gradient**, not a cliff. Every model shows it; some degrade more gently.]

.stat-attrib[Reproduce it live: needle-in-a-haystack, 0 → 40k filler words · Chroma "Context Rot" study in assets/]

???
Run the haystack demo. Same needle, same question, growing filler. Watch latency, cost, and (with enough noise + a subtle needle) correctness. Anthropic: "models remain highly capable at longer contexts but may show reduced precision for information retrieval and long-range reasoning." Waiting for bigger windows won't fix it: pollution and relevance problems apply at every size. demo: `02_context_budget.py`

---

.eyebrow-label[THE TOOLKIT]

# Four moves

.grid-4[
.card[.tag.w-tag[WRITE] Structured note-taking: a NOTES.md or memory tool the agent reads back after a reset.]
.card[.tag.s-tag[SELECT] Just-in-time retrieval: keep file paths and links, load the data only when needed.]
.card[.tag.c-tag[COMPRESS] Compaction: summarize the history, clear old tool results, restart the window.]
.card[.tag.i-tag[ISOLATE] Sub-agents: explore with 50k tokens, return a 1-2k summary to the lead.]
]

**Pick by task: compaction for back-and-forth, notes for milestones, sub-agents for parallel research.**

???
Anthropic's three long-horizon techniques (compaction, structured note-taking, sub-agent architectures) plus just-in-time retrieval map cleanly onto the four moves. Examples from the post: Claude Code compacts history and keeps the 5 most recent files; Claude playing Pokémon keeps tallies across thousands of steps in notes; research sub-agents burn tens of thousands of tokens each but return 1-2k. Cheapest compaction: tool result clearing. demo: `03_four_moves.py`

---

.eyebrow-label[WHERE IT BITES]

# Agent loops grow context every turn

```text
turn 1:  system + tools + user                      ~1.2k tokens
turn 2:  + tool call + 8k tool result               ~9.5k
turn 3:  + tool call + 12k tool result              ~22k
turn 8:  ...                                        ~140k  ← slow, expensive, distracted
```

**An agent is an LLM using tools in a loop. Nobody designed turn 8's context. It accumulated.**

*Fix at the source: tools return identifiers and slices, not whole objects. `head`, `tail`, a stored query, a file path.*

???
Anthropic's definition of an agent: "LLMs autonomously using tools in a loop." The failure is emergent. Tool results are the biggest offender. The just-in-time pattern: Claude Code runs targeted queries and uses head/tail over large data without ever loading the full object. Hybrid is fine: CLAUDE.md dropped in up front, glob/grep for the rest. Show the growth curve, then apply compress (truncate results) and write (offload to file). demo: `04_agent_loop_growth.py`

---

.eyebrow-label[PLAYBOOK]

# Treat context like a budget

.takeaways[
<ol>
<li><span class="num">1</span><div class="body"><strong>Start minimal, with the best model.</strong><span>Add instructions and examples only for failure modes you actually observe.</span></div></li>
<li><span class="num">2</span><div class="body"><strong>Measure it.</strong><span><code>count_tokens</code> on every call. You cannot manage what you don't see.</span></div></li>
<li><span class="num">3</span><div class="body"><strong>Trim at the source.</strong><span>Token-efficient tools. Clear old tool results. Return the 20 lines that matter, not 500.</span></div></li>
<li><span class="num">4</span><div class="body"><strong>Offload, don't accumulate.</strong><span>Notes and files outside the window; the window gets a pointer.</span></div></li>
</ol>
]

???
Anthropic's process: test a minimal prompt with the best model available, then add clear instructions and examples based on failure modes found in testing. "Minimal does not mean short." For compaction prompts: maximize recall first, then tune precision. Their closing advice: "do the simplest thing that works." Everything in later sessions is a refinement of these four lines.
